{% extends 'base.html' %}
{% block content %}
<h2>My Profile & Preferences</h2>
<form method="POST" class="card">
    <input type="hidden" name="update_profile" value="1">
    <div class="form-group"><label>Full Name</label><input type="text" name="full_name" value="{{ current_user.full_name or '' }}"></div>
    <div class="form-group"><label>Course / Major</label><input type="text" name="course" value="{{ current_user.course or '' }}"></div>
    <div class="form-group"><label>Home Location</label><input type="text" name="location" value="{{ current_user.location or '' }}"></div>
    <div class="form-group">
        <label>Food Preference</label>
        <select name="food_habit">
            <option value="Veg" {% if current_user.food_habit == 'Veg' %}selected{% endif %}>Vegetarian</option>
            <option value="Non-Veg" {% if current_user.food_habit == 'Non-Veg' %}selected{% endif %}>Non-Vegetarian</option>
        </select>
    </div>
    <div class="form-group">
        <label>Smoking Preference</label>
        <select name="smoking_preference">
            <option value="Non-Smoker" {% if current_user.smoking_preference == 'Non-Smoker' %}selected{% endif %}>Non-Smoker</option>
            <option value="Smoker" {% if current_user.smoking_preference == 'Smoker' %}selected{% endif %}>Smoker</option>
        </select>
    </div>
    <div class="form-group"><label>Study Habit</label><input type="text" name="study_habit" value="{{ current_user.study_habit or '' }}" placeholder="e.g. Quiet, Night Owl"></div>
    <div class="form-group"><label>Bio</label><textarea name="bio">{{ current_user.bio or '' }}</textarea></div>
    <button type="submit">Save Profile</button>
</form>

<hr>
<h3>Anonymous Roommate Rating & Feedback</h3>
<form method="POST" class="card">
    <input type="hidden" name="submit_feedback" value="1">
    <div class="form-group">
        <label>Select Student to Rate</label>
        <select name="target_user_id">
            {% for user in users %}
            <option value="{{ user.id }}">{{ user.full_name or user.username }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group"><label>Rating (1-5)</label><input type="number" name="rating" min="1" max="5" required></div>
    <div class="form-group"><label>Feedback</label><textarea name="feedback_text" placeholder="Write anonymous feedback..."></textarea></div>
    <button type="submit">Submit Feedback</button>
</form>

<h3>Received Feedback</h3>
{% for fb in feedbacks %}
<div class="card">
    <p><strong>Rating:</strong> {{ fb.rating }}/5</p>
    <p>{{ fb.feedback_text }}</p>
</div>
{% else %}
<p>No feedback received yet.</p>
{% endfor %}
{% endblock %}
